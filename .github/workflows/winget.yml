name: Publish to WinGet

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g. v3.0.0, or leave empty for latest release)'
        required: false
        default: 'v3.0.0'

jobs:
  winget:
    name: Publish to WinGet Community Repository
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Submit package to Windows Package Manager Community Repository
        uses: vedantmgoyal2009/winget-releaser@v2
        with:
          identifier: NotHarshhaa.DevOpsToolsInstaller
          installers-regex: 'DevOpsToolsInstaller_x64_Setup\.exe$'
          token: ${{ secrets.WINGET_TOKEN || secrets.GH_TOKEN }}
          release-tag: ${{ github.event.inputs.version }}
