name: Publish to WinGet

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g. v3.1.4, or leave empty for latest release)'
        required: false
        default: ''

jobs:
  winget:
    name: Publish to WinGet Community Repository
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Resolve Release Tag
        id: resolve_tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN || secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          $inputTag = "${{ github.event.inputs.version }}"
          $releaseEventTag = "${{ github.event.release.tag_name }}"
          
          if (-not [string]::IsNullOrWhiteSpace($inputTag)) {
            $tag = $inputTag
          } elseif (-not [string]::IsNullOrWhiteSpace($releaseEventTag)) {
            $tag = $releaseEventTag
          } else {
            # Fall back to latest release tag via GitHub CLI
            $tag = & gh release view --repo "${{ github.repository }}" --json tagName -q ".tagName"
            if (-not $tag) {
              $tag = "v3.1.4"
            }
          }
          
          Write-Host "Publishing WinGet package for release tag: $tag"
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          Write-Host "Waiting for release assets to be uploaded to tag $tag..."
          $assetFound = $false
          for ($i = 0; $i -lt 30; $i++) {
            $assets = & gh release view $tag --repo "${{ github.repository }}" --json assets -q ".assets[].name" 2>$null
            if ($assets -match "DevOpsToolsInstaller_x64_Setup\.exe") {
              Write-Host "Found matching release asset DevOpsToolsInstaller_x64_Setup.exe on $tag." -ForegroundColor Green
              $assetFound = $true
              break
            }
            Write-Host "Waiting for DevOpsToolsInstaller_x64_Setup.exe to finish uploading... (attempt $($i + 1)/30)"
            Start-Sleep -Seconds 15
          }
          if (-not $assetFound) {
            Write-Error "Timed out waiting for DevOpsToolsInstaller_x64_Setup.exe on release $tag."
          }

      - name: Submit package to Windows Package Manager Community Repository
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: NotHarshhaa.DevOpsToolsInstaller
          installers-regex: 'DevOpsToolsInstaller_x64_Setup\.exe$'
          token: ${{ secrets.WINGET_TOKEN || secrets.GH_TOKEN }}
          release-tag: ${{ steps.resolve_tag.outputs.tag }}
